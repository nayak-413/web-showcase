<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Portfolio | Project Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    <style>
        :root {
            --primary: #64ffda; /* Electric Teal */
            --bg: #0a192f;      /* Navy Dark */
            --card-bg: #112240; /* Lighter Navy */
            --text-main: #ccd6f6;
            --text-dim: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Project Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
        }

        .project-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        /* Staggered animation for cards */
        .project-card:nth-child(1) { animation-delay: 0.1s; }
        .project-card:nth-child(2) { animation-delay: 0.2s; }
        .project-child(3) { animation-delay: 0.3s; }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px -15px rgba(100, 255, 218, 0.3);
        }

        .project-card i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .project-card h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .project-card p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .view-link {
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-link::after {
            content: '→';
            transition: transform 0.3s ease;
        }

        .project-card:hover .view-link::after {
            transform: translateX(5px);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Projects Hub</h1>
        <!-- <p>Final Year Diploma Student | Computer Engineering</p> -->
    </header>

    <div class="container">
        
        <!-- PROJECT 1 -->
        <a href="./school-martt/" class="project-card">
            <i class="fa-solid fa-code"></i>
            <div>
                <h2>Project One</h2>
                <p>A webpage for a local Business (Stationary Shop). Tech used HTML, CSS, or JS.</p>
            </div>
            <span class="view-link">Launch Project</span>
        </a>

        <!-- PROJECT 2 -->
        <a href="./ssr-classes/" class="project-card">
            <i class="fa-solid fa-laptop-code"></i>
            <div>
                <h2>Project Two</h2>
                <p>SSR Classes Landing Page.</p>
            </div>
            <span class="view-link">Launch Project</span>
        </a>

        <!-- PROJECT 3 -->
        <a href="./sunshine-classes/" class="project-card">
            <i class="fa-solid fa-gears"></i>
            <div>
                <h2>Sunshine Coaching Classes</h2>
                <!-- <p>A more complex engineering project or laboratory exercise.</p> -->
            </div>
            <span class="view-link">Launch Project</span>
        </a>

    </div>

</body>
</html>
